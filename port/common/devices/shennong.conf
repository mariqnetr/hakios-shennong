# Device profile: sourced by common/build.sh and common/run.sh. Copy with common/new-device.sh.
# Everything here is plain shell variables; see docs/PORTING.md for where each value comes from.

NAME="Xiaomi 14 Pro (shennong)"
KIND=phone                      # phone | qemu
SOC="Qualcomm Snapdragon 8 Gen 3 (SM8650)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The phone boots a Mu-Silicium UEFI (Project Silicium) with `fastboot boot`; the UEFI starts our loader.
UEFI_TARGET=shennong
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/<target>Pkg/... or prebuilt/uefi
DTB=                            # the phone's own device tree (from its vendor_boot); empty: prebuilt/uefi/redwood.dtb
FD_BASE=0xA7100000              # UEFI_FD in shennongPkg MemoryMapLib (as giulia, same SoC). TODO: check against the phone
FD_SIZE=0x300000
PAYLOAD_BASE=0xC7800000         # "XNU Payload" (64 MB) in shennongPkg: free RAM below Android's reserved 0xCB800000.
                                # The shim takes only bits 16-31: below 4 GB, 64K-aligned. The loader is built with it.

# --- kernel and loader -----------------------------------------------------------------------------
# xnuloader/loader.c picks its `struct platform` by what the firmware reports (see docs/PORTING.md):
# a new SoC needs one there (common/new-device.sh writes a starting point next to this file).
FB_BASE=0xFC400000              # splash_region in shennong's device tree, 1440 x 3200 (the loader prints what the UEFI reports)
WIFI_ATH11K=0                   # the 14 Pro's radio is not a WCN6750 (FastConnect 7800 class, ath12k over PCIe): no Wi-Fi yet

# --- what the run needs ----------------------------------------------------------------------------
# First bring-up: one core, verbose text on the framebuffer, nothing redwood-specific.
# touchscreen=1 / gpu=1 / wifi=1 / adsp=1 drive redwood's GPIO, GPU and remote processors:
# NEVER enable them here before their drivers are ported to SM8650 addresses. cpufreq=1 and the buttons
# take this phone's addresses by its name (redwood_phone()); ddr= (memory bandwidth vote) is redwood's only.
# syna_touch=1 is this phone's own touch driver (bsd/dev/shennong_synaptics.c, Synaptics S3910P).
BOOTARGS="-v cpus=1 syna_touch=1"
DEFAULT_SECS=120
USERLAND_VARS=""                # extra variables for userland/build.sh, e.g. "GL=1"
# The phone's own firmware, taken from its Android (never in the repository): see docs/PORTING.md.
FIRMWARE=""
